<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">

    <title>Echoes of Sacrifice</title>

    <style>

        :root {
            --primary-color: #003153;
            --header-color: #555555;
            --secondary-color: #F4A261;
            --bg-color: #f9f7f1;
            --text-color: #333;
            --border-color: #ccc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 16px;
            line-height: 1.5;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 5px solid var(--primary-color);
            overflow: visible;
        }

        header {
            text-align: center;
            margin-bottom: 5px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        h1 {
            color: var(--header-color);
            margin-bottom: 5px;
            font-size: 2.5rem;
        }

        p.subtitle {
         
            font-style: italic;
            color: #666;
            font-size: 1.1rem;
        }

        .video-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 500px;
            background-color: #f5f5f5;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            margin: 5px 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .video-container h2 {
            color: var(--primary-color);
            font-size: 1rem;
            margin-bottom: 10px;
            margin-top: 0;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            background-color: #000;
            border-radius: 4px;
            overflow: hidden;
        }

        .video-wrapper video {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .container { padding: 5px; }
            .video-container { padding: 15px; }
        }

        @media (max-width: 768px) {
            body { padding: 5px; }
            .container { padding: 5px; }
            h1 { font-size: 1.8rem; }
            .video-container { padding: 15px; min-height: 400px; }
            .video-container h2 { font-size: 1.5rem; }
            .video-container p { font-size: 1rem; }
            .loading-spinner { width: 30px; height: 30px; }
            .video-wrapper { 
                min-height: 350px;
            }
        }

        @media (max-width: 480px) {
            body { padding: 5px; }
            .video-container { padding: 10px; min-height: 350px; }
            .video-container h2 { font-size: 1.3rem; }
            .loading-spinner { width: 30px; height: 30px; }
        }

        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; border: none; width: 100%; max-width: 100%; }
            .video-container { display: none; }
        }

    </style>

</head>

<body>

<div class="container">
    <header style="background-image: url('Thiepval.png'); background-size: 100% auto; background-position: center; background-repeat: no-repeat; min-height: 220px;">
</header>

    <div class="video-container">
        <h2><center><em>Through music and pictures, their spirit shines in the light</center></em></h2>

        <!-- Video wrapper for responsive video player -->
        <div class="video-wrapper">
            <video controls poster="">
                <source src="Sangro2.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <p style="font-size: 0.9rem; margin-top: 20px; color: #888;"></p>
    </div>

    <footer style="margin-top: 15px; text-align: center; font-size: 0.9rem; color: #777;">

        <p>--- by honour bound, by heritage kept, by heart remembered ---</p>

    </footer>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics of Sacrifice</title>

    <style>

        :root {
            --primary-color: #003153;
            --header-color: #555555;
            --secondary-color: #F4A261;
            --bg-color: #f9f7f1;
            --text-color: #333;
            --border-color: #ccc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 16px;
            line-height: 1.5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 5px solid var(--primary-color);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            background-image: url('beachy2.jpg');
            background-size: cover;
            background-position: top;
            background-repeat: no-repeat;
            min-height: 230px;
        }

        h1 {
            color: var(--header-color);
            margin-bottom: 5px;
            font-size: 2.5rem;
        }

        p.subtitle {
            font-style: italic;
            color: #666;
            font-size: 1.0rem;
        }

        .report-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 600px;
            background-color: #f5f5f5;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            margin: 20px 0;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        iframe {
            width: 100%;
            height: 700px;
            border: none;
            display: block;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .container { padding: 15px; }
            iframe { height: 600px; }
        }

        @media (max-width: 768px) {
            .container { padding: 20px; }
            h1 { font-size: 1.8rem; }
            iframe { height: 500px; }
            .loading-spinner { width: 30px; height: 30px; }
        }

        @media (max-width: 480px) {
            iframe { height: 400px; }
            .loading-spinner { width: 30px; height: 30px; }
        }

        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; border: none; width: 100%; max-width: 100%; }
            iframe { page-break-inside: avoid; height: 800px; }
        }

    </style>

</head>

<body>

<div class="container">
    <header>
    </header>
    <p style="font-size: 16px; font-weight: bold; font-style: italic; text-align: center;">Through our data, the truth of their final day finds the light, equal under God</p>

   


    <div class="report-container">
       <iframe width="600" height="443" src="https://datastudio.google.com/embed/reporting/ad76fd1e-8ea9-4028-8277-3fd94348e28b/page/BQdAG" frameborder="0" style="border:0" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>

    </div>

    <footer style="margin-top: 30px; text-align: center; font-size: 0.9rem; color: #777;">
        <p>For Your Tomorrow, We Gave Our Today - Remembered by the Class of '76</p>
    </footer>

</div>

</body>
</html>
